<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Focus Timer</title>
<style>
  :root {
    --bg: #12141c;
    --bg-glow: #1b1e2b;
    --surface: #1a1d29;
    --surface-2: #21242f;
    --text: #f2f3f7;
    --text-dim: #8b8fa3;
    --accent-focus: #ff6b6b;
    --accent-focus-2: #ff9a76;
    --accent-break: #4fd1c5;
    --accent-break-2: #63e6be;
    --ring-track: #2a2e3d;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, var(--bg-glow), var(--bg) 60%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .mode-toggle {
    display: flex;
    background: var(--surface);
    border-radius: 999px;
    padding: 5px;
    gap: 4px;
    box-shadow: 0 10px 30px var(--shadow);
  }

  .mode-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .mode-btn.active[data-mode="focus"] {
    background: linear-gradient(135deg, var(--accent-focus), var(--accent-focus-2));
    color: #1a1010;
  }

  .mode-btn.active[data-mode="break"] {
    background: linear-gradient(135deg, var(--accent-break), var(--accent-break-2));
    color: #0e1f1c;
  }

  .timer-wrap {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 12;
  }

  .ring-progress {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
  }

  .ring-progress.focus {
    stroke: url(#focusGradient);
  }

  .ring-progress.break {
    stroke: url(#breakGradient);
  }

  .timer-center {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .time {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .status-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    font-weight: 600;
  }

  .controls {
    display: flex;
    gap: 14px;
  }

  .ctrl-btn {
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 14px 28px;
    border-radius: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 8px 20px var(--shadow);
  }

  .ctrl-btn:active {
    transform: scale(0.96);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-focus), var(--accent-focus-2));
    color: #1a1010;
  }

  body[data-mode="break"] .btn-primary {
    background: linear-gradient(135deg, var(--accent-break), var(--accent-break-2));
    color: #0e1f1c;
  }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
  }

  .btn-secondary:hover,
  .btn-primary:hover {
    filter: brightness(1.08);
  }

  .session-counter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .session-count {
    font-size: 28px;
    font-weight: 700;
  }

  .session-caption {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .dots {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ring-track);
    transition: background 0.3s ease;
  }

  .dot.filled {
    background: linear-gradient(135deg, var(--accent-focus), var(--accent-focus-2));
  }
</style>
</head>
<body data-mode="focus">
  <div class="app">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="focus" id="focusBtn">Focus</button>
      <button class="mode-btn" data-mode="break" id="breakBtn">Break</button>
    </div>

    <div class="timer-wrap">
      <svg viewBox="0 0 300 300">
        <defs>
          <linearGradient id="focusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6b6b" />
            <stop offset="100%" stop-color="#ff9a76" />
          </linearGradient>
          <linearGradient id="breakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4fd1c5" />
            <stop offset="100%" stop-color="#63e6be" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="150" cy="150" r="130"></circle>
        <circle class="ring-progress focus" id="ringProgress" cx="150" cy="150" r="130"></circle>
      </svg>

      <div class="timer-center">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="status-label" id="statusLabel">Ready to focus</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn btn-primary" id="startPauseBtn">Start</button>
      <button class="ctrl-btn btn-secondary" id="resetBtn">Reset</button>
    </div>

    <div class="session-counter">
      <div class="session-count" id="sessionCount">0</div>
      <div class="session-caption">Focus sessions completed</div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <script>
    const FOCUS_SECONDS = 25 * 60;
    const BREAK_SECONDS = 5 * 60;
    const RADIUS = 130;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    const focusBtn = document.getElementById('focusBtn');
    const breakBtn = document.getElementById('breakBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ringProgress = document.getElementById('ringProgress');
    const sessionCountEl = document.getElementById('sessionCount');
    const dotsEl = document.getElementById('dots');
    const body = document.body;

    ringProgress.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
    ringProgress.style.strokeDashoffset = '0';

    let mode = 'focus';
    let totalSeconds = FOCUS_SECONDS;
    let remainingSeconds = FOCUS_SECONDS;
    let isRunning = false;
    let intervalId = null;

    let sessionCount = parseInt(localStorage.getItem('pomodoro_sessions') || '0', 10);

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      const fraction = remainingSeconds / totalSeconds;
      const offset = CIRCUMFERENCE * (1 - fraction);
      ringProgress.style.strokeDashoffset = offset.toString();
    }

    function updateStatusLabel() {
      if (mode === 'focus') {
        statusLabel.textContent = isRunning ? 'Focusing…' : (remainingSeconds === totalSeconds ? 'Ready to focus' : 'Paused');
      } else {
        statusLabel.textContent = isRunning ? 'On a break…' : (remainingSeconds === totalSeconds ? 'Ready to relax' : 'Paused');
      }
    }

    function renderSessionCount() {
      sessionCountEl.textContent = sessionCount.toString();
      dotsEl.innerHTML = '';
      const dotsToShow = ((sessionCount - 1) % 4) + 1;
      const filledCount = sessionCount === 0 ? 0 : dotsToShow;
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i < filledCount ? ' filled' : '');
        dotsEl.appendChild(dot);
      }
    }

    function setMode(newMode, resetTime = true) {
      mode = newMode;
      body.setAttribute('data-mode', mode);

      focusBtn.classList.toggle('active', mode === 'focus');
      breakBtn.classList.toggle('active', mode === 'break');

      ringProgress.classList.toggle('focus', mode === 'focus');
      ringProgress.classList.toggle('break', mode === 'break');

      if (resetTime) {
        pauseTimer();
        totalSeconds = mode === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS;
        remainingSeconds = totalSeconds;
      }

      updateDisplay();
      updateStatusLabel();
    }

    function tick() {
      if (remainingSeconds > 0) {
        remainingSeconds -= 1;
        updateDisplay();
      }

      if (remainingSeconds <= 0) {
        pauseTimer();
        handleSessionComplete();
      }
    }

    function handleSessionComplete() {
      if (mode === 'focus') {
        sessionCount += 1;
        localStorage.setItem('pomodoro_sessions', sessionCount.toString());
        renderSessionCount();
        setMode('break', true);
        statusLabel.textContent = 'Focus done — time for a break';
      } else {
        setMode('focus', true);
        statusLabel.textContent = 'Break over — back to focus';
      }
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startPauseBtn.textContent = 'Pause';
      updateStatusLabel();
      intervalId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startPauseBtn.textContent = 'Start';
      clearInterval(intervalId);
      intervalId = null;
      updateStatusLabel();
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      updateDisplay();
      updateStatusLabel();
    }

    startPauseBtn.addEventListener('click', () => {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    focusBtn.addEventListener('click', () => {
      if (mode !== 'focus') setMode('focus', true);
    });

    breakBtn.addEventListener('click', () => {
      if (mode !== 'break') setMode('break', true);
    });

    // init
    setMode('focus', true);
    renderSessionCount();
  </script>
</body>
</html>
